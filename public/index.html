<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MessMantra</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css"></head>
<body><header id="top"></header>
<main><div class="hero">
  <div><h1>One QR.<br><span>One meal.</span></h1>
  <p class="mut" style="font-size:18px">Choose your meal before the cutoff, show a rotating signed QR, and let the kitchen cook exactly what is needed.</p></div>
  <form class="card" id="form"><h2 id="title">Login</h2>
    <label id="nameWrap" hidden>Name<input id="name" autocomplete="name"></label>
    <label>Email<input id="email" type="email" required autocomplete="username"></label>
    <label>Password<input id="password" type="password" required minlength="8" autocomplete="current-password"></label>
    <button type="submit" id="go">Login</button>
    <p class="mut" id="swap" style="cursor:pointer;text-align:center">New student? Sign up</p>
  </form>
</div></main>
<script type="module" src="/js/login.js"></script></body></html>
